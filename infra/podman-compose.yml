version: "3.8"

services:
  mariadb:
    image: mariadb:11
    pod: api-manager-pod
    container_name: api-manager-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - api-manager-db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  backend:
    build: ../backend
    pod: api-manager-pod
    container_name: api-manager-backend
    environment:
      PORT: 55001
      HOST: 0.0.0.0
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      DB_DATABASE: ${MARIADB_DATABASE}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS}
      SESSION_HARD_MAX_SECONDS: ${SESSION_HARD_MAX_SECONDS}
      JWT_SECRET_PATH: /data/jwt/secret
      TLS_CERT_PATH: /data/tls/cert.pem
      TLS_KEY_PATH: /data/tls/key.pem
      BOOTSTRAP_ADMIN: ${BOOTSTRAP_ADMIN:-true}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      SEED_DATA: ${SEED_DATA}
      SEED_ACCESS_LOGS: ${SEED_ACCESS_LOGS}
      CORS_ORIGIN: http://localhost:55000
    volumes:
      - api-manager-tls:/data/tls
      - api-manager-jwt:/data/jwt
    depends_on:
      - mariadb
    ports:
      - "55001:55001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('https').get('https://127.0.0.1:55001/healthz',{rejectUnauthorized:false},res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  frontend:
    build: ../frontend
    pod: api-manager-pod
    container_name: api-manager-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "55000:55000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:55000',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
      ]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      - backend
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    pod: api-manager-pod
    container_name: api-manager-phpmyadmin
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_AUTH_TYPE: cookie
    depends_on:
      - mariadb
    restart: unless-stopped

  phpmyadmin-https:
    image: caddy:2
    pod: api-manager-pod
    container_name: api-manager-phpmyadmin-https
    ports:
      - "55002:443"
    volumes:
      - ./phpmyadmin/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - api-manager-phpmyadmin-data:/data
      - api-manager-phpmyadmin-config:/config
    depends_on:
      - phpmyadmin
    restart: unless-stopped

volumes:
  api-manager-db-data:
  api-manager-tls:
  api-manager-jwt:
  api-manager-phpmyadmin-data:
  api-manager-phpmyadmin-config:
